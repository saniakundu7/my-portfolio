<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Enquiries</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0c1016;color:#dde5ee;padding:24px}
h1{color:#6cc4d4}table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{padding:10px;border:1px solid #232e3c;text-align:left}th{background:#141a22}
tr:nth-child(even){background:#0f141c}.empty{color:#95a2b3;margin-top:20px}
</style>
</head>
<body>
<h1>Enquiries</h1>
<div id="status"></div>
<table id="tbl" hidden><thead><tr><th>Name</th><th>Email</th><th>Service</th><th>Message</th><th>Date</th></tr></thead><tbody></tbody></table>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://rjmkuescftmslqchvrbx.supabase.co",SUPABASE_ANON_KEY="sb_publishable_CfC4B-dBj3KFzCpR4BHhXA_6ZPyZBkI";
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var st=document.getElementById("status"),tbl=document.getElementById("tbl"),tb=tbl.querySelector("tbody");
sb.from("enquiries").select("*").order("created_at",{ascending:false}).then(function(r){
  if(r.error){st.textContent="Error: "+r.error.message;return}
  if(!r.data||!r.data.length){st.textContent="No enquiries yet.";return}
  st.textContent=r.data.length+" enquiry(s)";tbl.hidden=false;
  r.data.forEach(function(e){var tr=document.createElement("tr");
    tr.innerHTML="<td>"+(e.name||"")+"</td><td>"+(e.email||"")+"</td><td>"+(e.service||"")+"</td><td>"+(e.message||"")+"</td><td>"+(e.created_at?new Date(e.created_at).toLocaleString():"")+"</td>";
    tb.appendChild(tr)});
});
</script>
</body>
</html>
